auth:
  bootstrap:
    admin-password: "${AUTH_BOOTSTRAP_ADMIN_PASSWORD:ChangeMeOnFirstLogin!123}"
  mfa:
    secret-encryption-key-base64: "${AUTH_MFA_SECRET_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}"
  jwks:
    overlap-seconds: 7200

spring:
  application:
    name: authentication
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/authentication
    username: "${AUTH_DB_USERNAME:authentication}"
    password: "${AUTH_DB_PASSWORD:authentication}"
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: "${AUTH_REDIS_HOST:localhost}"
      port: "${AUTH_REDIS_PORT:6379}"
  mail:
    host: "${AUTH_MAIL_HOST:localhost}"
    port: "${AUTH_MAIL_PORT:1025}"

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: authentication

server:
  port: 8080
